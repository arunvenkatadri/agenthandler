name: Publish

# Publishes to PyPI and npm when a GitHub release is published, using trusted
# publishing (OIDC): no API tokens are stored in the repository.
#
# One-time setup:
#   PyPI: pypi.org > agenthandler > Settings > Publishing > add a GitHub publisher
#         owner arunvenkatadri, repo agenthandler, workflow publish.yml, environment pypi.
#   npm:  npmjs.com > agenthandler > Settings > Trusted publishing > GitHub Actions,
#         same owner/repo, workflow publish.yml.
#   GitHub: Settings > Environments > create "pypi" and "npm" (optionally with required reviewers).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "tag $GITHUB_REF_NAME != version $v"; exit 1; }
          test "$(node -p "require('./npm/package.json').version")" = "$v"
      - run: python -m pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  npm:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish (skipped when this version is already on npm)
        working-directory: npm
        run: |
          npm install -g npm@latest
          v=$(node -p "require('./package.json').version")
          if npm view "agenthandler@$v" version >/dev/null 2>&1; then echo "agenthandler@$v already published"; exit 0; fi
          npm publish --provenance --access public
